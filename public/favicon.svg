<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <!-- Emerald Glow Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Metallic Platinum Gradient -->
    <linearGradient id="platGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#e2e8f0" />
      <stop offset="80%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Squircle Rounded App Icon (matching mobile / browser tab app icons) -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="#10b981" stroke-width="12" filter="url(#shadow)" />

  <!-- Inner Subtle Border -->
  <rect x="42" y="42" width="428" height="428" rx="92" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.6" />

  <!-- Shield Shape in Center -->
  <path d="M 256 95 L 375 145 C 375 285 256 385 256 405 C 256 385 137 285 137 145 Z" fill="#042f2e" stroke="url(#emeraldGrad)" stroke-width="8" filter="url(#shadow)" />

  <!-- Eagle Wings Silhouette Accent -->
  <path d="M 256 125 C 275 110 325 105 350 120 C 330 135 290 145 256 155 C 222 145 182 135 162 120 C 187 105 237 110 256 125 Z" fill="url(#goldGrad)" opacity="0.9" />

  <!-- Stylized Monogram "NL" -->
  <g id="NL-Letters" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="180" text-anchor="middle" dominant-baseline="central">
    <!-- Drop shadow text -->
    <text x="228" y="278" fill="#021f19" font-style="italic" letter-spacing="-8">NL</text>
    <text x="225" y="275" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="3" font-style="italic" letter-spacing="-8">NL</text>
  </g>

  <!-- Stars / Eagle emblem top center -->
  <circle cx="256" cy="180" r="10" fill="#fef08a" />
  <circle cx="226" cy="184" r="6" fill="#fde047" opacity="0.8" />
  <circle cx="286" cy="184" r="6" fill="#fde047" opacity="0.8" />

  <!-- Notification Badge on Top Right (like Snapchat (16) tab in screenshot) -->
  <circle cx="410" cy="98" r="38" fill="#ef4444" stroke="#ffffff" stroke-width="8" filter="url(#shadow)" />
  <circle cx="410" cy="98" r="16" fill="#ffffff" />
</svg>
